[package]
name = "lightningparse"
version = "0.1.0"
edition = "2021"

[lib]
name = "lightningparse"
crate-type = ["cdylib", "rlib"]

[dependencies]
lopdf = "0.33"
pyo3 = { version = "0.21", features = ["extension-module"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
