[project]
name = "lightningparse-api"
version = "0.1.0"
description = "FastAPI service for LightningParse"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]",
    "pydantic",
    "langchain",
    "langchain-community",
    "langchain-openai",
    "chromadb",
    "langchain-chroma",
    "python-multipart"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx"
]

[tool.setuptools]
packages = ["api", "chunking", "pipeline"]

